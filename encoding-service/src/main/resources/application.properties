spring.application.name=encoding-service

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=encoding-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer


spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.netflix.encodingservice.event.VideoUploadedEvent

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

server.port=8083

# AWS config
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION:eu-north-1}

aws.s3.bucket-name=${AWS_BUCKET_NAME:netflix-streaming-videos-528730633309-eu-north-1-an}

# actuator
management.endpoints.web.exposure.include=health, info

# FFmpeg config
ffmpeg.path: ${FFMPEG_PATH:/opt/homebrew/bin/ffmpeg}

encoding.temp-dir=/Users/yraul72gmail.com/Documents/tmp/encoding/

logging.file.name=logs/encoding-service.log


spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

