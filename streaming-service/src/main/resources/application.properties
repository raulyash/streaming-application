spring.application.name=streaming-service

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id =  streaming-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.properties.spring.json.trusted.packages="*"
spring.kafka.consumer.properties.spring.json.use.type.header=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.netflix.streamingservice.event.VideoEncodedEvent

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

server.port=8084

# AWS configuration
aws.access-key="${AWS_ACCESS_KEY:}"
aws.secret-key="${AWS_SECRET_KEY:}"
aws.region="${AWS_REGION:}"

aws.s3.bucket-name=netflix-streaming-videos-528730633309-eu-north-1-an
# Presigned expiry URL in minutes.
aws.s3.presigned-url-expiry=60

management.endpoints.web.exposure.include=health, info


